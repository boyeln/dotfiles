[[language]]
name = "svelte"
language-servers = [ "svelteserver", "tailwindcss-ls", "vscode-eslint-language-server" ]
formatter = { command = "dprint", args = ["fmt", "--stdin", "svelte"] }
auto-format = true

[[language]]
name = "typescript"
language-servers = [ "typescript-language-server", "tailwindcss-ls", "vscode-eslint-language-server" ]
formatter = { command = "dprint", args = ["fmt", "--stdin", "ts" ] }
auto-format = true

