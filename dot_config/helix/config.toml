
theme = "catppuccin_mocha"

[editor]
soft-wrap.enable = true
rulers = [81]
line-number = "relative"
bufferline = "always"
cursorline = true
color-modes = true
true-color = true

[editor.file-picker]
hidden = false
git-ignore = false

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[editor.lsp]
auto-signature-help = false
display-messages = true
display-inlay-hints = false

[editor.statusline]
left = ["mode", "file-type",  "file-encoding" , "version-control"] 
center = ["spinner","file-name", "file-modification-indicator"]
right = [
    "selections",
    "primary-selection-length",
    "position",
    "total-line-numbers",
    "spacer",
    "diagnostics",
    "workspace-diagnostics",
]
separator = "|"

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
X = "extend_line_above"
A-up = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
A-down = ["extend_to_line_bounds", "delete_selection", "paste_after"]
S-up = "page_cursor_half_up"
S-down = "page_cursor_half_down"
S-left = "jump_backward"
S-right = "jump_forward"
S-ret = "save_selection"
B = ":sh echo \"%sh{git show --no-patch --format='%%h | %%an | %%ar | %%s' $(git blame -p %{buffer_name} -L%{cursor_line},+1 | head -1 | cut -d' ' -f1)}\""

[keys.normal.space]
w = ":write"
q = ":buffer-close"
Q = ":buffer-close-others"
"=" = ":reflow 80"
"%" = ":sh printf '%{buffer_name}' | pbcopy"

[keys.insert]
C-space = "completion"
S-tab = "move_parent_node_start"


